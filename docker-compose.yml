services:
  postgres:
    image: postgres:17
    container_name: fitmind-postgres
    environment:
      POSTGRES_DB: fitmind
      POSTGRES_USER: fitmind
      POSTGRES_PASSWORD: fitmind_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  qdrant:
    image: qdrant/qdrant:latest
    container_name: fitmind-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  postgres_data:
  qdrant_data: